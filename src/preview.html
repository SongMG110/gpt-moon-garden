    @media(max-width:420px){#gpt-moon-garden .mg-main{display:flex;flex-direction:column;min-height:0}#gpt-moon-garden .mg-chat-column{display:contents}#gpt-moon-garden .mg-home{max-width:none;margin:5px 17px 0;order:1}#gpt-moon-garden .mg-prompts{max-width:none;margin-bottom:10px}#gpt-moon-garden .mg-thread{padding-bottom:0;min-height:0;margin:15px 17px 0;order:1;position:relative;z-index:2}#gpt-moon-garden .mg-companion{position:relative;bottom:auto;right:auto;width:150px;margin:16px auto;order:2}#gpt-moon-garden .mg-companion-art{height:240px}#gpt-moon-garden .mg-bubble{position:static;max-width:180px;margin:0 0 10px}#gpt-moon-garden .mg-composer{position:relative;z-index:2;order:3;margin:8px 17px 0}#gpt-moon-garden .mg-scene-note{position:relative;z-index:2;order:4;margin:10px 17px 40px}}
    @media(pointer:coarse){#gpt-moon-garden .mg-segment button,#gpt-moon-garden .mg-small-action,#gpt-moon-garden .mg-prompt{min-height:44px}#gpt-moon-garden textarea{font-size:16px!important}#gpt-moon-garden .mg-send{width:44px;height:44px}}
  </style>
  <div class="mg-window">

<script>
(()=>{
const root=document.getElementById('gpt-moon-garden');
const saved=window.openai?.widgetState?.modelContent||{};
const state={style:saved.style==='chibi'?'chibi':'portrait',mood:saved.mood==='night'?'night':'day',size:100,artwork:82,visible:true};
const find=s=>root.querySelector(s), all=s=>root.querySelectorAll(s);
let bubbleTimer,replyTimer,bounceTimer,scene=false,clicks=0;
const save=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{style:state.style,mood:state.mood},privateContent:{size:state.size,artwork:state.artwork}}).catch(()=>{});};
function render(){
root.dataset.mood=state.mood;
root.style.setProperty('--mg-scale',state.size/100);
root.style.setProperty('--mg-art',state.artwork/100);
all('[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===state.style)));
all('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===state.mood)));
all('[data-character]').forEach(i=>i.hidden=i.dataset.character!==state.style);
find('.mg-companion').hidden=!state.visible;
find('[data-role]').textContent=state.style==='chibi'?'你的随身灵感小伙伴':'月光下的灵感同行者';
find('[data-title]').textContent=state.mood==='day'?'月白云庭':'暮紫星庭';
}
function say(text){clearTimeout(bubbleTimer);find('[data-bubble]').textContent=text;find('[data-bubble]').hidden=false;find('.mg-local').hidden=true;bubbleTimer=setTimeout(()=>{find('[data-bubble]').hidden=true;find('.mg-local').hidden=false;},4200);}
function bounce(){clearTimeout(bounceTimer);const p=find('.mg-pet-button');p.classList.remove('mg-pet-bounce');void p.offsetWidth;p.classList.add('mg-pet-bounce');bounceTimer=setTimeout(()=>p.classList.remove('mg-pet-bounce'),750);}
function showHome(){clearTimeout(replyTimer);scene=false;find('[data-home]').hidden=false;find('[data-thread]').hidden=true;all('[data-scene] span').forEach(e=>e.textContent='对话预览');find('[data-status]').textContent='陪伴待机';}
function showChat(message,animate=false){clearTimeout(replyTimer);scene=true;find('[data-home]').hidden=true;find('[data-thread]').hidden=false;find('[data-user]').textContent=message;all('[data-scene] span').forEach(e=>e.textContent='返回首页');find('[data-reply]').textContent=animate?'正在把灵感整理成形…':'可以。我们先让界面安静下来，再给灵感留一点光。银白与淡紫是底色，右侧是我的位置；原画和 Q 版，都可以陪你一起工作。';find('[data-status]').textContent=animate?'正在思考 · 演示':'已完成 · 演示';if(animate){say('交给我，我们一步一步来。');replyTimer=setTimeout(()=>{find('[data-reply]').textContent='收到啦。这里是外观交互演示：正式版本可以在这个位置显示回答，并让右侧伙伴同步进入工作、等待和完成状态。';find('[data-status]').textContent='已完成 · 演示';say('完成啦，下一步也一起吧。');bounce();},1500);}}
all('[data-style]').forEach(b=>b.addEventListener('click',()=>{state.style=b.dataset.style;render();save();}));
all('[data-theme]').forEach(b=>b.addEventListener('click',()=>{state.mood=b.dataset.theme;render();save();}));
all('[data-scene]').forEach(b=>b.addEventListener('click',()=>scene?showHome():showChat('我想要一个有 GPT娘陪伴的工作台。')));
find('[data-new]').addEventListener('click',showHome);
all('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{find('textarea').value=b.dataset.prompt;find('textarea').focus();}));
find('.mg-pet-button').addEventListener('click',()=>{const lines=state.style==='chibi'?['哼哼，今天的灵感由我守护。','别只看着我呀，该开始构建啦。','要休息一下吗？我在这里等你。']:['月光已经准备好了，你的想法呢？','慢慢来，好想法值得耐心。','我在。一起把它做好吧。'];say(lines[clicks++%lines.length]);bounce();});
function send(){const t=find('textarea');const value=t.value.trim();if(!value){t.focus();return;}showChat(value,true);t.value='';}
find('.mg-send').addEventListener('click',send);
find('textarea').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'size',{label:'人物大小',min:75,max:110,unit:'%'});tweak.addSlider(state,'artwork',{label:'背景浓度',min:30,max:100,unit:'%'});tweak.addToggle(state,'visible',{label:'显示人物'});}
})();
</script>
