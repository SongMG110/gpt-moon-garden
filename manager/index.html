<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT娘 · 月白云庭</title>
<style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#393346;background:#f1edf7;font-size:14px;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{padding:24px 28px 18px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #dcd4e8;background:#faf8fe}h1{font:400 25px Georgia,'SimSun',serif;margin:0}header p{color:#7c718d;margin:4px 0 0;font-size:12px}.tag{margin-left:auto;padding:5px 10px;background:#ebe4f5;border-radius:20px;font-size:12px}main{display:grid;grid-template-columns:285px minmax(0,1fr);gap:24px;padding:24px;max-width:1550px;margin:auto}.controls{background:#faf8fe;padding:20px;border:1px solid #dcd4e8;border-radius:14px}h2{font-size:14px;font-weight:500;margin:0 0 18px}label{display:block;margin:17px 0 7px;color:#655a77;font-size:12px}input,select,button{font:inherit}select{width:100%;padding:9px;border:1px solid #d9cfe6;border-radius:8px;background:#fff;color:inherit}input[type=range]{width:100%;accent-color:#8a73ae}.check{display:flex;align-items:center;gap:8px;margin:14px 0}.check input{accent-color:#8a73ae}button{border:1px solid #d9cfe6;background:#fff;color:#493b5b;border-radius:8px;padding:9px 12px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8a73ae;outline-offset:3px}.primary{background:#83709f;border-color:#83709f;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}button:disabled{opacity:.5;cursor:wait}.status{line-height:1.8;font-size:12px;color:#655a77;border-top:1px solid #e6dfed;padding-top:16px;margin-top:18px;overflow-wrap:anywhere}.status strong{color:#44384f;font-weight:500}.error{color:#a02f43}iframe{border:0;width:100%;height:850px;background:#f7f5fc;border-radius:14px}.preview-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#766a85;font-size:12px}.preview-top a{color:#6e568e;text-decoration:none}.note{font-size:12px;color:#7b7089;line-height:1.9;margin-top:16px}output{float:right;font-variant-numeric:tabular-nums}footer{padding:0 24px 24px;color:#84798f;font-size:11px;text-align:center}@media(max-width:950px){main{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.controls h2,.actions,.status{grid-column:1/-1}iframe{height:950px}}@media(max-width:450px){main{padding:14px}.controls{display:block}header{padding:20px 16px;flex-wrap:wrap}header .tag{margin:0}iframe{height:1100px}}
</style></head><body>
<header><div><h1>GPT娘 · 月白云庭</h1><p>原画立绘 / Q版伙伴 / 月白与暮紫</p></div><span class="tag" id="tag">独立预览</span></header>
<main><section class="controls" aria-label="外观控制"><h2>外观与伙伴</h2>
<div><label for="character">人物风格</label><select id="character"><option value="portrait">原画立绘</option><option value="chibi">Q版伙伴</option></select></div>
<div><label for="mood">背景氛围</label><select id="mood"><option value="day">月白云庭</option><option value="night">暮紫星庭</option></select></div>
<div><label for="size">人物大小 <output id="size-value">100%</output></label><input id="size" type="range" min="55" max="130" value="100"></div>
<div><label for="artwork">背景浓度 <output id="artwork-value">70%</output></label><input id="artwork" type="range" min="0" max="100" value="70"></div>
<div><label class="check"><input id="petVisible" type="checkbox" checked>显示人物</label><label class="check"><input id="motion" type="checkbox" checked>互动动效</label></div>
<div class="actions"><button id="apply" class="primary" type="button">应用到 Codex</button><button id="restore" type="button">恢复默认</button><button id="check" type="button">检查连接</button></div>
<div class="status" aria-live="polite"><strong id="state-title">尚未应用</strong><div id="status">正在读取设置…</div><div id="error" role="alert" class="error"></div><div class="note">应用需要 Codex 已启用本机调试接口。缺少接口时不会关闭或重启应用。素材和样式支持热更新；控制器代码更新需重启控制器。</div></div>
</section><section aria-label="主题预览"><div class="preview-top"><span>外观预览 · 不调用模型</span><a href="/preview" target="_blank" rel="noopener">单独打开预览 ↗</a></div><iframe src="/preview" title="月白云庭交互预览"></iframe></section></main>
<footer>Community project · 不修改官方安装文件 · 本机管理，无遥测</footer>
<script>
const token='__CSRF_TOKEN__';
const fields=['character','mood','size','artwork','petVisible','motion'];
let config={},busy=false;
const get=id=>document.getElementById(id);
function update(data){if(data.config)config=data.config;for(const k of fields){const el=get(k);if(typeof config[k]==='boolean')el.checked=config[k];else if(config[k]!==undefined)el.value=config[k];}get('size-value').textContent=config.size+'%';get('artwork-value').textContent=config.artwork+'%';get('tag').textContent=config.enabled?'已启用':'独立预览';get('state-title').textContent=data.status?.applied?'已应用到 '+data.status.applied+' 个工作区':config.enabled?'等待连接':'尚未应用';get('status').textContent=data.status?.message||'';document.querySelector('iframe').contentWindow.postMessage({type:'moon-garden-config',config},location.origin);}
async function request(route,body={}){if(busy)return;busy=true;document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);get('error').textContent='';try{const res=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Moon-Token':token},body:JSON.stringify(body)});const data=await res.json();if(data.config)update(data);if(!res.ok)throw new Error(data.error||'操作失败');}catch(e){get('error').textContent=e.message;}finally{busy=false;document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);}}
for(const key of fields)get(key).addEventListener('change',()=>{const el=get(key);request('/api/config',{[key]:el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value});});
for(const key of ['size','artwork'])get(key).addEventListener('input',()=>get(key+'-value').textContent=get(key).value+'%');
get('apply').onclick=()=>request('/api/apply');get('restore').onclick=()=>request('/api/restore');get('check').onclick=()=>request('/api/check');
async function refresh(){if(busy)return;try{const res=await fetch('/api/status');update(await res.json());}catch(e){get('status').textContent='管理服务已断开，请重新启动。';}}
document.querySelector('iframe').addEventListener('load',refresh);refresh();setInterval(refresh,4000);
</script></body></html>
